allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
# Configuración de pnpm (incluso fuera de un monorepo).
# Permite que estos paquetes ejecuten sus scripts de instalación
# (Prisma necesita generar el cliente al instalar).
onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - "prisma"
  - "esbuild"
