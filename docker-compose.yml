# Levanta una base de datos PostgreSQL local para desarrollo.
# Uso: docker-compose up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: raysafe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: raysafe
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: